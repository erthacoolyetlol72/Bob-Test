name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      final:
        description: 'Build the FINAL release (no debug, ARM 32+64 bit) and publish it as the Android release.'
        type: boolean
        default: false
      all_archs:
        description: 'Build every kind of phone (ARM 32+64 bit and Intel). Off = only 64-bit ARM, which is what current phones and BlueStacks use.'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  buildAndroid:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: sudo apt-get update -qq && (sudo apt-get install -y -qq libncurses5 || true)

      # Done before switching to Java 11: the runner's sdkmanager needs its default Java 17
      - name: Install Android SDK parts
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-29" "build-tools;30.0.3" > /dev/null
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r15c

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/haxelib
            ~/.gradle
            .hxcpp_cache
          # a new key every run so the compile cache is saved again each time
          key: android-build-${{ github.run_id }}
          restore-keys: android-build-

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp 4.2.1 --quiet --always
          haxelib install lime 7.9.0 --quiet --always
          haxelib install openfl 9.1.0 --quiet --always
          haxelib install flixel 4.11.0 --quiet --always
          haxelib install flixel-addons 2.11.0 --quiet --always
          haxelib install flixel-ui 2.4.0 --quiet --always
          haxelib install hscript 2.5.0 --quiet --always
          haxelib install actuate --quiet --always
          haxelib install newgrounds 1.3.0 --quiet --always
          haxelib install polymod 1.3.1 --quiet --always
          haxelib install extension-androidtools 1.8.4 --quiet --always
          # installing the libraries above can pull newer lime/hxcpp, so pin them back
          haxelib set hxcpp 4.2.1 --always
          haxelib set lime 7.9.0 --always
          haxelib set openfl 9.1.0 --always
          haxelib set flixel 4.11.0 --always
          haxelib set flixel-addons 2.11.0 --always
          haxelib set flixel-ui 2.4.0 --always
          haxelib set hscript 2.5.0 --always
          haxelib set polymod 1.3.1 --always
          haxelib set extension-androidtools 1.8.4 --always
          haxelib list

      - name: Setup Lime for Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
          # JCenter is shut down; Lime 7.9's Gradle templates still point at it
          grep -rl "jcenter()" ~/haxelib/lime --include=*.gradle | xargs -r sed -i 's/jcenter()/mavenCentral()/g'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Decide build type
        run: |
          # a commit message containing [final] (or the manual "final" option) builds the final release
          if [[ "${{ github.event.head_commit.message }}" == *"[final]"* || "${{ github.event.inputs.final }}" == "true" ]]; then
            echo "FINAL=1" >> "$GITHUB_ENV"
            echo "Building the FINAL release"
          else
            echo "FINAL=0" >> "$GITHUB_ENV"
            echo "Building a debug test build"
          fi

      - name: Turn the cutscene videos into pictures
        run: |
          # phones have no video player, so the game shows each video as pictures plus its sound track
          sudo apt-get install -y -qq ffmpeg
          for v in ronPreCutscene ronEndCutscene; do
            mkdir -p "assets/preload/videoframes/$v"
            ffmpeg -loglevel error -i "assets/preload/videos/$v/$v.webm" -vf scale=960:-2 -q:v 4 "assets/preload/videoframes/$v/f%04d.jpg"
            echo "$v: $(ls assets/preload/videoframes/$v | wc -l) pictures (video says $(cat assets/preload/videos/$v/$v.txt) frames)"
          done
          du -sh assets/preload/videoframes

      - name: Compile
        env:
          # hxcpp reuses compiled files from this folder, so only changed code is recompiled
          HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
        run: |
          set +e
          if [ "$FINAL" = "1" ]; then
            # final: normal release build for 32 and 64 bit phones (no Intel code: BlueStacks then uses the 64-bit ARM version)
            ARCHS="-armv7 -arm64"
            FLAGS="-D NO_PRECOMPILED_HEADERS"
          else
            ARCHS="-arm64"
            if [ "${{ github.event.inputs.all_archs }}" = "true" ]; then ARCHS="-armv7 -arm64 -32"; fi
            # debug test build: crash traces on, Flixel debugger overlay off
            FLAGS="-debug -D NO_PRECOMPILED_HEADERS -D HXCPP_CHECK_POINTER -D FLX_NO_DEBUG"
          fi
          echo "Building for: $ARCHS with: $FLAGS"
          haxelib run lime build android $ARCHS $FLAGS 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            ERRS=$(grep -n -E "error:|Error:|undefined reference|ld: |\*\*\*|FAILED|Exception|cannot find|No such file|what went wrong" build.log | grep -v -i "warning" | head -8 | cut -c1-300 | tr '\n' '|')
            TAILS=$(tail -n 15 build.log | cut -c1-250 | tr '\n' '|')
            echo "::error::ERRORS ${ERRS} TAIL ${TAILS}"
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bob-Android
          path: exportJon/*/android/bin/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish final release
        if: env.FINAL == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-final
          name: Bob's Onslaught - Android (final)
          prerelease: false
          body: Final Android release built from ${{ github.sha }}. Download the .apk below and install it (64-bit and 32-bit ARM phones, and BlueStacks).
          files: exportJon/*/android/bin/app/build/outputs/apk/debug/*.apk

      - name: Publish test release
        if: env.FINAL != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-latest
          name: Test build (latest)
          prerelease: true
          body: Automatic test build of ${{ github.sha }} (debug build with crash traces).
          files: exportJon/*/android/bin/app/build/outputs/apk/debug/*.apk
