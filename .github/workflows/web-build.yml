name: Build Web Version (iPhone / browser)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build HTML5
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 7.9.0 --quiet --always
          haxelib install openfl 9.1.0 --quiet --always
          haxelib install flixel 4.11.0 --quiet --always
          haxelib install flixel-addons 2.11.0 --quiet --always
          haxelib install flixel-ui 2.4.0 --quiet --always
          haxelib install hscript 2.5.0 --quiet --always
          haxelib install actuate --quiet --always
          haxelib install newgrounds 1.3.0 --quiet --always
          haxelib install polymod 1.3.1 --quiet --always
          haxelib set lime 7.9.0 --always
          haxelib set openfl 9.1.0 --always
          haxelib set flixel 4.11.0 --always
          haxelib set flixel-addons 2.11.0 --always
          haxelib set flixel-ui 2.4.0 --always
          haxelib set hscript 2.5.0 --always
          haxelib set polymod 1.3.1 --always
          haxelib list

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Make .mp3 copies of every .ogg that has none
        run: |
          count=0
          while IFS= read -r f; do
            m="${f%.ogg}.mp3"
            if [ ! -f "$m" ]; then
              ffmpeg -nostdin -loglevel error -y -i "$f" -codec:a libmp3lame -q:a 4 "$m"
              count=$((count+1))
            fi
          done < <(find assets -name '*.ogg')
          echo "Converted $count files to mp3"

      - name: Turn the cutscene videos into pictures
        run: |
          for v in ronPreCutscene ronEndCutscene; do
            mkdir -p "assets/preload/videoframes/$v"
            ffmpeg -nostdin -loglevel error -i "assets/preload/videos/$v/$v.webm" -vf scale=640:-2 -q:v 8 "assets/preload/videoframes/$v/f%04d.jpg"
            echo "$v: $(ls assets/preload/videoframes/$v | wc -l) pictures"
          done
          du -sh assets/preload/videoframes

      - name: Patch code for the web
        run: |
          cat > sourceJon/WebQuit.hx << 'EOF'
          package;

          class WebQuit
          {
            public static function quit():Void
            {
              #if sys
              Sys.exit(0);
              #elseif js
              js.Browser.location.reload();
              #end
            }
          }
          EOF
          sed -i 's/Sys\.exit(0);/WebQuit.quit();/' sourceJon/OnslaughtEndingState.hx sourceJon/GameOverSubstate.hx sourceJon/EndingState.hx

          cat > sourceJon/SmokeTest.hx << 'EOF'
          package;

          class SmokeTest
          {
            public static var active:Bool = false;

            public static function check():Bool
            {
              return false;
            }

            public static function startNext():Void {}

            public static function update(elapsed:Float):Void {}
          }
          EOF

          sed -i 's/var ogg:String = leSource.replace(".webm", ".ogg");/var ogg:String = leSource.replace(".webm", ".mp3");/' sourceJon/VideoState.hx

          sed -i 's#</project>#<window if="html5" width="0" height="0" resizable="true" fullscreen="false" />\n</project>#' Project.xml

          grep -n "WebQuit" sourceJon/*.hx | head
          grep -n 'replace(".webm", ".mp3")' sourceJon/VideoState.hx
          grep -n 'if="html5" width="0"' Project.xml

      - name: Compile
        run: |
          set +e
          haxelib run lime build html5 -final -D mobile 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            ERRS=$(grep -n -E "Error|error:|Type not found|has no field|Unknown identifier" build.log | head -12 | cut -c1-300 | tr '\n' '|')
            echo "::error::BUILD FAILED. ${ERRS}"
          fi
          exit $code

      - name: Make it work as a full-screen app on iPhone
        run: |
          OUT=$(ls -d exportJon/release/html5/bin)
          ls -la "$OUT" | head -20
          sed -i 's#<head>#<head>\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">#' "$OUT/index.html" || true
          du -sh "$OUT"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: exportJon/release/html5/bin

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
